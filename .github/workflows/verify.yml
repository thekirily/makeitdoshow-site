name: Verify launch site
on:
  push:
    branches: [launch]
    paths-ignore:
      - 'evidence/**'
      - 'docs/**'
      - 'handback.md'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static routes and conversion logic
        run: |
          python3 scripts/build.py
          python3 scripts/verify.py
          python3 -m unittest discover -s tests -v
          node --check assets/site.js
          git diff --exit-code -- '*.html' sitemap.xml robots.txt
      - name: Measure Lighthouse on the launch build
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8115 --bind 127.0.0.1 > /tmp/makeitdo-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8115/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/measure.py --directory evidence/lighthouse/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-lighthouse
          path: evidence/lighthouse/ci/
          retention-days: 14
