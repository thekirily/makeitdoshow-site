name: Public site uptime and certificate
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: public-site-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe HTTPS and certificate (21 day warning)
        id: health
        continue-on-error: true
        run: python3 scripts/monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uptime-evidence
          path: monitor-result.json
          retention-days: 14
      - name: Open an alert issue or close on recovery
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const title = '[monitor] makeitdoshow.com health failure';
            const {owner, repo} = context.repo;
            const {data: issues} = await github.rest.issues.listForRepo({owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => i.title === title);
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.PROBE_OUTCOME !== 'success') {
              const body = `HTTPS availability or TLS certificate probe failed. Inspect the uptime-evidence artifact in [this run](${url}). Certificate warnings begin at 21 days. This alert stays open until a successful probe.`;
              if (!existing) await github.rest.issues.create({owner, repo, title, body});
              core.setFailed('Public site health check failed');
            } else if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body: `Recovered: [successful probe](${url}).`});
              await github.rest.issues.update({owner, repo, issue_number: existing.number, state: 'closed'});
            }
